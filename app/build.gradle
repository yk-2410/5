plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reed.fcmguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.reed.fcmguard"
        minSdk 21
        targetSdk 22
        versionCode 40
        versionName "2.0.0"
    }

    signingConfigs {
        def customDebugKeystore = rootProject.file('ci-signing/fcmguard-debug.keystore')
        if (customDebugKeystore.exists()) {
            debug {
                storeFile customDebugKeystore
                storePassword ('and' + 'roid')
                keyAlias 'fcmguarddebug'
                keyPassword ('and' + 'roid')
            }
        }
    }

    buildTypes {
        debug {
            def customDebugKeystore = rootProject.file('ci-signing/fcmguard-debug.keystore')
            if (customDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
